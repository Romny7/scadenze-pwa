<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scadenze</title>
  <meta name="theme-color" content="#2e7d32" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Scadenze" />
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); max-width: 640px; margin-inline: auto; }
    h1 { font-size: 1.3rem; } textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; }
    button { font: inherit; padding: 10px 16px; margin-top: 8px; }
    .badges span { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 8px; border-radius: 10px; background: #8883; font-size: .8rem; }
    .ok { background: #2e7d3255 !important; } .ko { background: #c6282855 !important; }
    form > * { display: block; width: 100%; box-sizing: border-box; margin-top: 8px; font: inherit; padding: 8px; }
    form label { padding: 0; } form label input { display: inline; width: auto; }
    ul { list-style: none; padding: 0; } li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #8884; }
    li > div { flex: 1; } li span { padding: 2px 8px; border-radius: 10px; font-size: .8rem; } li button { margin: 0; padding: 4px 10px; }
    .s0 { background: #2e7d3255; } .s1 { background: #f9a82566; } .s2 { background: #ef6c0066; } .s3 { background: #8886; } .s4 { background: #c6282866; }
    .tabs button { margin: 0 8px 0 0; } .calhead { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; } .calhead button { margin: 0; padding: 6px 16px; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; } .grid .day { margin: 0; padding: 4px 0; min-height: 52px; }
    .day.today { outline: 2px solid #2e7d32; } .day.sel { background: #2e7d3244; } .detail { margin-top: 8px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 1px; }
    .dot.s0 { background: #2e7d32; } .dot.s1 { background: #f9a825; } .dot.s2 { background: #ef6c00; } .dot.s3 { background: #888; } .dot.s4 { background: #c62828; }
    pre { background: #8882; padding: 8px; overflow-x: auto; white-space: pre-wrap; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>Scadenze</h1>
  <div class="badges" id="badges"></div>

  <h3>Aggiungi prodotto</h3>
  <form id="f">
    <input id="name" required placeholder="Nome prodotto" />
    <input id="gtin" inputmode="numeric" placeholder="Codice a barre (facoltativo)" />
    <input id="date" type="date" required />
    <label><input id="monthOnly" type="checkbox" /> Solo mese/anno (vale fine mese)</label>
    <select id="kind">
      <option value="0">Tipo: non so</option>
      <option value="1">Da consumarsi entro</option>
      <option value="2">Preferibilmente entro (TMC)</option>
    </select>
    <button type="submit">Salva</button>
    <div id="err" class="ko"></div>
  </form>

  <div class="tabs"><button id="tList">Lista</button><button id="tCal">Calendario</button></div>
  <div id="vList"><ul id="list"></ul></div>
  <div id="vCal" hidden><div id="cal"></div></div>

  <details><summary>Strumento di lettura data (test)</summary>
    <textarea id="text" rows="3">Da consumarsi preferibilmente entro il 08/2027</textarea>
    <button id="go">Analizza e precompila</button>
    <pre id="out">—</pre>
    <pre id="log"></pre>
  </details>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
